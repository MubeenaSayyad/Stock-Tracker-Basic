<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>
<style>
body{
    font-family:Arial;
    background:#0b1220;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:#111827;
    padding:30px;
    border-radius:12px;
    width:350px;
    box-shadow:0 4px 15px rgba(0,0,0,0.6);
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.2);
    background:#0f172a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

a{
    color:#22c55e;
    text-decoration:none;
}

.message{
    color:yellow;
    margin-bottom:10px;
}
</style>
</head>
<body>

<div class="card">
<h2>🔑 Forgot Password</h2>

{% if message %}
<p class="message">{{message}}</p>
{% endif %}

<form method="POST">
    <input type="email" name="email" placeholder="Enter Email" required>
    <input type="password" name="new_password" placeholder="Enter New Password" required>
    <button type="submit">Reset Password</button>
</form>

<br>
<a href="/login">⬅ Back to Login</a>
</div>

</body>
</html>
