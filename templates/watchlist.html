<!DOCTYPE html>
<html>
<head>
    <title>Watchlist</title>

    <style>
        body{
            font-family:'Segoe UI', Arial;
            background:#0b1220;
            margin:0;
            color:#e2e8f0;
        }

        .navbar{
            background:#0f172a;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .navbar h2{
            margin:0;
            color:#22c55e;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-right:15px;
        }

        .container{
            padding:20px;
        }

        .card{
            background:rgba(17,24,39,0.95);
            padding:15px;
            border-radius:16px;
            margin-bottom:15px;
            box-shadow:0 4px 18px rgba(0,0,0,0.55);
            border:1px solid rgba(255,255,255,0.08);
        }

        input{
            padding:10px;
            width:250px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.15);
            background:#0f172a;
            color:white;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#16a34a;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        th, td{
            padding:12px;
            text-align:left;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        th{
            color:#22c55e;
        }

        .remove{
            color:red;
            text-decoration:none;
            font-weight:bold;
        }

        .view{
            color:deepskyblue;
            text-decoration:none;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="navbar">
    <h2>⭐ Watchlist</h2>

    <div>
        <a href="/dashboard">🏠 Dashboard</a>
        <a href="/trade_history">📜 History</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card">
        <h3>Add Stock</h3>
        <form action="/add_watchlist" method="POST">
            <input type="text" name="symbol" placeholder="Enter Symbol (TSLA)" required>
            <button type="submit">Add</button>
        </form>
    </div>

    <div class="card">
        <h3>Your Watchlist</h3>

        {% if watchlist %}
        <table>
            <tr>
                <th>Symbol</th>
                <th>Action</th>
            </tr>

            {% for w in watchlist %}
            <tr>
                <td>{{ w[0] }}</td>
                <td>
                    <a class="view" href="/watch/{{w[0]}}">View</a> |
                    <a class="remove" href="/remove_watchlist/{{w[0]}}">Remove</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
            <p>No stocks in watchlist</p>
        {% endif %}

    </div>

</div>

</body>
</html>
