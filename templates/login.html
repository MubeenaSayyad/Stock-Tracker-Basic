<!DOCTYPE html>
<html>
<head>
<title>Login - Algo Trade</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#f4f7fb;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:380px;
    background:white;
    padding:40px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
    border:1px solid #e2e8f0;
    text-align:center;
}

h2{
    margin-top:0;
    color:#2563eb;
    font-size:22px;
}

p{
    font-size:14px;
    color:#64748b;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    outline:none;
    font-size:14px;
}

input:focus{
    border:1px solid #2563eb;
    box-shadow:0 0 6px rgba(37,99,235,0.3);
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    font-size:15px;
    margin-top:12px;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

a{
    display:block;
    margin-top:12px;
    font-size:14px;
    text-decoration:none;
    color:#16a34a;
    font-weight:600;
}

a:hover{
    text-decoration:underline;
}

.msg{
    margin-top:15px;
    font-size:14px;
    color:red;
}
</style>
</head>

<body>

<div class="box">
    <h2>📈 Algo Trade Login</h2>
    <p>Login to access your dashboard</p>

    <form method="POST">
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <a href="/register">Create New Account</a>

    {% if message %}
    <div class="msg">{{message}}</div>
    {% endif %}
</div>

</body>
</html>
